[package]
name = "mongreldb-kit-python"
version = "0.64.16"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings for MongrelDB Kit: a schema-aware persistence layer with migrations, constraints, and a query builder."
repository = "https://github.com/visorcraft/MongrelDB-Kit"
keywords = ["mongreldb", "database", "pyo3", "migrations", "bindings"]
categories = ["database"]

[lib]
name = "mongreldb_kit_py"
crate-type = ["cdylib"]

[dependencies]
mongreldb-kit = { path = "../mongreldb-kit", version = "0.64.16" }
mongreldb-kit-core = { path = "../mongreldb-kit-core", version = "0.64.16" }
# abi3-py310: one wheel per platform covers CPython 3.10+ (3.12/3.13/3.14
# included) instead of needing a per-interpreter build matrix.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = { version = "1", features = ["preserve_order"] }
